name: Setup desktop graphics
description: >-
  Give Linux and Windows runners software Vulkan and OpenGL drivers for the
  production bridges.

# Linux presents Lavapipe output through Mesa OpenGL. Windows uses dzn so Vulkan can import the
# D3D12 resource created by Skiko. Windows OpenGL uses Mesa D3D12 over WARP.
# macOS bundles MoltenVK and ANGLE in its runtime artifacts and needs no driver setup.

runs:
  using: composite
  steps:
    - name: Install Mesa software drivers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes \
          libegl-mesa0 \
          libgl1-mesa-dri \
          libvulkan1 \
          mesa-utils \
          mesa-utils-extra \
          mesa-vulkan-drivers
        {
          echo "EGL_PLATFORM=surfaceless"
          echo "LIBGL_ALWAYS_SOFTWARE=true"
        } >> "$GITHUB_ENV"

    - name: Install the Vulkan runtime (Windows)
      if: runner.os == 'Windows'
      uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
      with:
        vulkan_version: 1.4.341.1
        cache: true
        stripdown: true
        # dzn is an ICD, not the vulkan-1.dll loader that LWJGL opens.
        install_runtime: true

    - name: Install Mesa Vulkan and OpenGL drivers (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        function Save-CheckedArchive($Url, $Path, $ExpectedHash) {
          Invoke-WebRequest -Uri $Url -OutFile $Path
          $actualHash = (Get-FileHash $Path -Algorithm SHA256).Hash
          if ($actualHash -ne $ExpectedHash) {
            throw "Archive hash mismatch for $Url`: expected $ExpectedHash, got $actualHash"
          }
        }

        function Register-VulkanDriver($Manifest) {
          $driverKey = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $driverKey -Force | Out-Null
          New-ItemProperty -Path $driverKey -Name $Manifest -PropertyType DWord -Value 0 -Force | Out-Null
        }

        $mesaVersion = "26.1.3"
        if ($env:RUNNER_ARCH -eq "ARM64") {
          $architecture = "arm64"
          $openGlHash = "C7B65C2CDF8774E19CEAB45FA7BBE18D2C7E735D9CE879BC071A25DFFAD46ECF"
          $expectedHash = "9F235A7A1195B91DC4140133D614FC7BA26A804DB16C43AE51F840FED5E84AD7"
          $manifestName = "dzn_icd.aarch64.json"
        } else {
          $architecture = "x64"
          $openGlHash = "195EA10AE0E682E6B2A265C4C7E96D229F09A8A24C92D5A9BE2D210214D7B14E"
          $expectedHash = "58222C2972549FA617DE6485ADD07A5CE57B728AE005744D2FD14E419A7D670D"
          $manifestName = "dzn_icd.x86_64.json"
        }
        $archiveName = "mesa-dzn-$architecture-$mesaVersion.7z"
        $mesaUrl = "https://github.com/mmozeiko/build-mesa/releases/download/$mesaVersion/$archiveName"

        $mesaArchive = Join-Path $env:RUNNER_TEMP $archiveName
        $mesaRoot = Join-Path $env:RUNNER_TEMP "dzn-$mesaVersion-$env:RUNNER_ARCH"
        Save-CheckedArchive $mesaUrl $mesaArchive $expectedHash
        7z x $mesaArchive "-o$mesaRoot" -y | Out-Null

        $driverManifest = Get-ChildItem $mesaRoot -Recurse -Filter $manifestName |
          Select-Object -First 1
        if (-not $driverManifest) {
          throw "Missing dzn Vulkan ICD manifest $manifestName in $mesaArchive"
        }

        $driver = Get-ChildItem $mesaRoot -Recurse -Filter "vulkan_dzn.dll" |
          Select-Object -First 1
        if (-not $driver) {
          throw "Missing dzn Vulkan driver in $mesaArchive"
        }

        Register-VulkanDriver $driverManifest.FullName
        "VK_DRIVER_FILES=$($driverManifest.FullName)" >> $env:GITHUB_ENV
        "Path=$($driver.Directory.FullName);$env:Path" >> $env:GITHUB_ENV

        $openGlArchiveName = "mesa-d3d12-$architecture-$mesaVersion.7z"
        $openGlArchive = Join-Path $env:RUNNER_TEMP $openGlArchiveName
        $openGlRoot = Join-Path $env:RUNNER_TEMP "mesa-opengl-$mesaVersion-$architecture"
        Save-CheckedArchive `
          "https://github.com/mmozeiko/build-mesa/releases/download/$mesaVersion/$openGlArchiveName" `
          $openGlArchive $openGlHash
        7z x $openGlArchive "-o$openGlRoot" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "Could not extract $openGlArchiveName" }

        $openGl = Join-Path $openGlRoot "opengl32.dll"
        if (-not (Test-Path $openGl)) { throw "Missing Mesa WGL driver in $openGlArchiveName" }
        # Register Mesa as an ICD so system GDI pixel-format calls and both FFI and LWJGL
        # WGL calls reach the same driver, including in a fresh snapshot-only process.
        Copy-Item $openGl (Join-Path $env:WINDIR "System32\mesadrv.dll") -Force
        $openGlDriverKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"
        New-Item -Path $openGlDriverKey -Force | Out-Null
        New-ItemProperty -Path $openGlDriverKey -Name DLL -PropertyType String -Value "mesadrv.dll" -Force | Out-Null
        New-ItemProperty -Path $openGlDriverKey -Name DriverVersion -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path $openGlDriverKey -Name Flags -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path $openGlDriverKey -Name Version -PropertyType DWord -Value 2 -Force | Out-Null
        # LIBGL_ALWAYS_SOFTWARE makes the d3d12 driver use WARP, but Mesa's WGL front end also
        # drops d3d12 from its driver list under that variable, and this build has no llvmpipe.
        # Naming the driver keeps it selected.
        "GALLIUM_DRIVER=d3d12" >> $env:GITHUB_ENV
        "LIBGL_ALWAYS_SOFTWARE=true" >> $env:GITHUB_ENV

    - name: Expose the Vulkan loader (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $architecture = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64" } else { "x64" }
        $candidates = @("runtime\$architecture", "Bin", "bin") |
          ForEach-Object { Join-Path $env:VULKAN_SDK $_ }
        $directory = $candidates |
          Where-Object { Test-Path (Join-Path $_ "vulkan-1.dll") } |
          Select-Object -First 1
        if ($directory) {
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append
        } elseif (-not (Get-Command vulkan-1.dll -ErrorAction SilentlyContinue)) {
          throw "No vulkan-1.dll in $($candidates -join ', ') or on PATH"
        }
