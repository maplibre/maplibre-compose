name: Metrics

# Measures new commits on main into the R2 bucket the code metrics page reads.
# A release tag refreshes the tags in the published index.
on:
  push:
    branches: [main]
    tags: [v*.*.*]
  workflow_dispatch:
    inputs:
      rebuild:
        description:
          Measure every commit since v0.1.0 again with the current reporter.
        type: boolean
        default: false

permissions:
  contents: read

# Each sync appends to the index the previous one wrote.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: cloudflare-pages
      deployment: false
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run metrics:publish ${{ inputs.rebuild && '--rebuild' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
