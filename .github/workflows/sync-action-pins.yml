# Dependabot updates the catalog, which it can see, and leaves composite
# actions stale. This job copies the catalog SHAs onto those consumers and
# pushes one commit. Hygiene then sees a clean tree.
name: Sync action pins

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Apply catalog pins
    if: >-
      github.actor == 'dependabot[bot]'
      && startsWith(github.head_ref, 'dependabot/github_actions/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dependabot events mint a read-only token unless the job asks for write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default checkout is the merge commit, which cannot be pushed.
          ref: ${{ github.head_ref }}
      - name: Copy catalog pins onto consumers
        run: python3 .mise/tasks/ci/fix-action-pins
      - name: Commit rewritten pins
        run: |
          set -euo pipefail
          git add -- .github/workflows .github/actions
          if git diff --cached --quiet; then
            echo "Consumers already match the catalog."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: apply action pin catalog to consumers"
          git push
