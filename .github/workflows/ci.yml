name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # All static analysis, Android Lint included; every other job is a platform.
  # `fix` then a clean-tree assertion rather than `check`, because a push cannot
  # reach a fork's branch. It runs first, so formatting still fails in seconds.
  hygiene:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          dprint-cache: "true"
          pnpm-cache: "true"
          save-toolchains: "true"
      - run: mise run fix
      - name: Check formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code
          git diff --cached --exit-code
      - run: mise run lint:android

  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the latest, Android 16 (Baklava); also the leg that ships
          # the demo APK, which does not vary by API level
          - api-level: 36
            artifact_name: demo-app-android
          # the oldest we support, Android 7 (Nougat) (supports back to ~Galaxy S6 from 2015)
          - api-level: 24
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          android-emulator: ${{ matrix.api-level }}
      - run: mise run test:android
      - id: android-device-tests
        run: mise run test:android:device ${{ matrix.api-level }}
      - name: Capture Android emulator diagnostics
        if: ${{ failure() && steps.android-device-tests.outcome == 'failure' }}
        run: mise run android-emulator:diagnostics
      - name: Upload Android emulator diagnostics
        if: ${{ failure() && steps.android-device-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: android-${{ matrix.api-level }}-diagnostics
          path: |
            build/android-emulator/avd/**/*.ini
            build/android-emulator/diagnostics
            build/android-emulator/emulator.log
            **/build/outputs/androidTest-results
            **/build/reports/androidTests
      - if: ${{ matrix.artifact_name != '' }}
        run: mise run build:android-app
      - if: ${{ matrix.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path: demo-app/android/build/outputs/apk/debug/android-debug.apk

  ios:
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "true"
      - run: mise run test:ios

  ios-device:
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "false" # ios owns this label
      - run: mise run build:ios:device

  js:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run test:js

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            save_toolchains: "false" # ios owns this label
            artifact_type: dmg
            artifact_name: demo-app-desktop-macos-arm64
          - runner: ubuntu-24.04
            save_toolchains: "false" # hygiene owns this label
            artifact_type: deb
            artifact_name: demo-app-desktop-linux-x64
          - runner: ubuntu-24.04-arm
            save_toolchains: "true"
            artifact_type: deb
            artifact_name: demo-app-desktop-linux-arm64
          - runner: windows-2022
            save_toolchains: "true"
            artifact_type: msi
            artifact_name: demo-app-desktop-windows-x64
          - runner: windows-11-arm
            save_toolchains: "true"
            artifact_type: msi
            artifact_name: demo-app-desktop-windows-arm64
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop-vulkan
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: ${{ matrix.save_toolchains }}
      - run: mise run test:desktop
      - run: mise run build:desktop-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path:
            "demo-app/desktop/build/compose/binaries/main/${{ matrix.artifact_type }}/*"

  docs:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # version-args reads the release tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          pnpm-cache: "true"
      - run: mise run build:docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  all-good:
    needs:
      - hygiene
      - android
      - ios
      - ios-device
      - js
      - desktop
      - docs
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'All checks passed!'
