name: CI

# The draft tier: every pull request, plus every variant on main and on manual
# runs. Readiness and label changes are handled by CI ready and CI full, so a
# commit's draft results stand once they exist.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      secrets:
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: draft
    secrets: inherit
    permissions:
      actions: write
      checks: read
      contents: write
