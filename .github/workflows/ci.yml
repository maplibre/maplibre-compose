name: Windows Blacksmith probe

# Temporary investigation: restore the normal tier workflows before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/job-desktop.yml
    with:
      secrets-available: false
      matrix: >-
        {"variant":["blacksmith-default","blacksmith-awt","github-2025"],"include":[{"variant":"blacksmith-default","runner":"blacksmith-4vcpu-windows-2025","save_toolchains":"true","artifact_type":"nsis","artifact_glob":"*.exe","artifact_name":"windows-probe-blacksmith-default","test_variant":"windows-probe-blacksmith-default","java_tool_options":""},{"variant":"blacksmith-awt","runner":"blacksmith-4vcpu-windows-2025","save_toolchains":"true","artifact_type":"nsis","artifact_glob":"*.exe","artifact_name":"windows-probe-blacksmith-awt","test_variant":"windows-probe-blacksmith-awt","java_tool_options":"-Djava.awt.headless=false"},{"variant":"github-2025","runner":"windows-2025","save_toolchains":"true","artifact_type":"nsis","artifact_glob":"*.exe","artifact_name":"windows-probe-github-2025","test_variant":"windows-probe-github-2025","java_tool_options":""}]}
