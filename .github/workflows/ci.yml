name: Windows Blacksmith probe

# Temporary investigation: restore the normal tier workflows before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  graphics:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-4vcpu-windows-2025, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          gradle: "false"
      - uses: ./.github/actions/setup-desktop-vulkan
      - name: Probe native graphics APIs without a window
        shell: pwsh
        run: ./ci/probe-windows-graphics.ps1
