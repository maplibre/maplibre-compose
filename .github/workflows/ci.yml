name: CI

# Every pull request commit, main, and manual runs. Rubberstamp plans which
# coverage units a pull request needs, per .config/rubberstamp.yml, and
# ci/plan.py selects their jobs from ci/jobs.json. Every other event runs every
# unit.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      secrets:
        type: boolean
        default: true

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    # The plan action waits up to ten minutes for Rubberstamp, then runs every unit.
    timeout-minutes: 15
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      secrets: ${{ steps.plan.outputs.secrets }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - id: rubberstamp
        uses: sargunv/rubberstamp/actions/plan@971af366b2649956a949eb48f2670cc66ba43988 # main
      - id: plan
        env:
          RUBBERSTAMP_ALL: ${{ steps.rubberstamp.outputs.all }}
          RUBBERSTAMP_UNITS: ${{ steps.rubberstamp.outputs.units }}
        run: bash .mise/tasks/ci/plan

  # Hygiene runs on every event, without waiting for the plan.
  hygiene:
    timeout-minutes: 25
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          # The docs versions file is generated from the release tags.
          fetch-tags: true
      - uses: ./.github/actions/setup-ci-deps
        with:
          dprint-cache: "true"
          pnpm-cache: "true"
          save-toolchains: "true"
      - run: mise run fix
      - name: Check formatted files
        run: |
          git update-index -q --refresh
          git diff --exit-code
          git diff --cached --exit-code
      - run: mise run lint:android
      - run: mise run ci:test-scripts
      - run: mise run benchmark:test
      - run: mise run style-spec:parity -- --check

  abi:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'abi')
    timeout-minutes: 20
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "true"
      - run: mise run api:check

  docs:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'docs')
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy-cloudflare.outputs.pages-deployment-alias-url }}
      deployment: >-
        ${{
          github.event_name == 'push'
          || (github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.secrets != 'false')
        }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          pnpm-cache: "true"
          maplibre-gl-js-cache: "true"
      - run: mise run test:pages
        env:
          DOCS_BANNER: >-
            ${{ github.event_name == 'pull_request' && format(
              'This site is a preview of <a href="{0}">pull request #{1}</a>.',
              github.event.pull_request.html_url,
              github.event.number)
            || 'This site is a preview of the main branch. The published
            documentation is at <a
            href="https://maplibre.org/maplibre-compose/">maplibre.org</a>.' }}
      - name: Measure the head commit for the code metrics page
        if: github.event_name == 'pull_request'
        run: mise run metrics:check
      - run: mise run package:js-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: demo-app-browser
          path: demo-app/common/build/packages/MapLibreCompose-browser.tar.gz
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist
      - name: Deploy the Cloudflare Pages preview
        id: deploy-cloudflare
        if: ${{ fromJSON(needs.plan.outputs.secrets) }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          CLOUDFLARE_BRANCH: >-
            ${{ github.event_name == 'pull_request' && format('pr-{0}',
            github.event.number) || 'main' }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy build/cloudflare-pages --project-name=maplibre-compose
            --branch=${{ env.CLOUDFLARE_BRANCH }}
          packageManager: pnpm
          wranglerVersion: "4.125.0"
      - name: Report the Cloudflare Pages preview
        if: steps.deploy-cloudflare.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-cloudflare.outputs.deployment-url }}
          PREVIEW_URL:
            ${{ steps.deploy-cloudflare.outputs.pages-deployment-alias-url }}
        run: |
          url="${PREVIEW_URL:-$DEPLOYMENT_URL}"
          echo "Cloudflare Pages: ${url}/maplibre-compose/" >> "$GITHUB_STEP_SUMMARY"

  js:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'js')
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          maplibre-gl-js-cache: "true"
      - id: js-tests
        run: mise run test:js
      - name: Upload JS test results to Trunk
        if: ${{ !cancelled() && fromJSON(needs.plan.outputs.secrets) }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "**/build/test-results/jsBrowserTest/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: js-browser-linux-x64
          previous-step-outcome: ${{ steps.js-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload JS test reports
        if: ${{ failure() && steps.js-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: js-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results

  ios-device:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ios-device')
    timeout-minutes: 45
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "false"
          native-cache-scope: ios-device
      - run: mise run build:ios:device

  macos-native:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'macos-native')
    timeout-minutes: 45
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "false"
          native-cache-scope: macos-native
      - id: macos-native-tests
        run: mise run test:macos
      - name: Upload macOS Native test results to Trunk
        if: ${{ !cancelled() && fromJSON(needs.plan.outputs.secrets) }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "**/build/test-results/macosArm64Test/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: macos-native-arm64
          previous-step-outcome: ${{ steps.macos-native-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload macOS Native test reports
        if: ${{ failure() && steps.macos-native-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: macos-native-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
      - run: mise run build:macos-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: demo-app-macos-native-arm64
          path: demo-app/macos/build/MapLibreCompose-macos-arm64.tar.gz

  android:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'android')
    name: android / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.android) }}
    timeout-minutes: 45
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      # API 24 is minSdk. Its Package Manager hangs on UTP streamed
      # install-write (#1047). Oreo is the oldest image that completes that
      # path, so ci/jobs.json pairs the current API with 26.
      - uses: ./.github/actions/setup-ci-deps
        with:
          android-emulator: ${{ matrix.api-level }}
          # The artifact variant publishes the JS artifact in test:publishing.
          maplibre-gl-js-cache: ${{ matrix.artifact_name != '' }}
      - id: android-host-tests
        if: ${{ matrix.api-level == 36 }}
        run: mise run test:android
      - name: Upload Android host test results to Trunk
        if:
          ${{ !cancelled() && matrix.api-level == 36 &&
          fromJSON(needs.plan.outputs.secrets) }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "**/build/test-results/testDebugUnitTest/TEST-*.xml,**/build/test-results/testAndroidHostTest/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: android-host
          previous-step-outcome: ${{ steps.android-host-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload Android host test reports
        if: ${{ failure() && steps.android-host-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: android-${{ matrix.api-level }}-host-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
      - id: android-device-tests
        run: mise run test:android:device ${{ matrix.api-level }}
      - name: Upload Android device test results to Trunk
        if: ${{ !cancelled() && fromJSON(needs.plan.outputs.secrets) }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "**/build/outputs/androidTest-results/**/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: android-device-api-${{ matrix.api-level }}
          previous-step-outcome: ${{ steps.android-device-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      # Job timeout is cancelled, not failure. Logcat's TestRunner lines name a
      # hung test, so capture after every device-test outcome, including cancel.
      - name: Capture Android emulator diagnostics
        if: ${{ always() && steps.android-device-tests.outcome != 'skipped' }}
        continue-on-error: true
        run: mise run android-emulator:diagnostics
      - name: Upload Android emulator diagnostics
        if: ${{ always() && steps.android-device-tests.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: android-${{ matrix.api-level }}-diagnostics
          path: |
            build/android-emulator/diagnostics
            ~/.local/state/devices-cli
            build/android-emulator/device-tests.log
            build/android-emulator/serial
            **/build/outputs/androidTest-results
            **/build/reports/androidTests
      - if: ${{ matrix.artifact_name != '' }}
        run: mise run build:android-app
      - if: ${{ matrix.artifact_name != '' }}
        run: mise run test:publishing
      - if: ${{ matrix.artifact_name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path: |
            demo-app/android/build/outputs/apk/release/android-release.apk
            demo-app/wearos/build/outputs/apk/release/wearos-release.apk
            demo-app/android-auto/build/outputs/apk/release/android-auto-release.apk

  ios:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ios')
    name: ios / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ios) }}
    timeout-minutes: 45
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "false"
          native-cache-scope: ios-simulator
      # The oldest supported iOS, which the pbxproj deployment targets and
      # getting-started page name. The runner image ships only current runtimes.
      - if: ${{ matrix.ios-version != '' }}
        run: mise run ios-simulator:install-runtime ${{ matrix.ios-version }}
      - id: ios-tests
        run: mise run test:ios ${{ matrix.ios-version }}
      - name: Upload iOS test results to Trunk
        if: ${{ !cancelled() && fromJSON(needs.plan.outputs.secrets) }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "**/build/test-results/iosSimulatorArm64Test/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: ios-simulator-${{ matrix.ios-version || 'arm64' }}
          previous-step-outcome: ${{ steps.ios-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload iOS test reports
        if: ${{ failure() && steps.ios-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: ios-${{ matrix.variant }}-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
      - if: ${{ matrix.variant == 'latest' }}
        run: mise run build:ios-simulator-app
      - if: ${{ matrix.variant == 'latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: demo-app-ios-simulator-arm64
          path: demo-app/ios/build/MapLibreCompose-ios-simulator-arm64.tar.gz

  desktop:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'desktop')
    name: desktop / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop) }}
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    steps:
      # Blacksmith's checkout caches the repository only on its Linux runners,
      # and on macOS it ignores `fetch-tags`.
      - if:
          ${{ startsWith(matrix.runner, 'blacksmith-') &&
          contains(matrix.runner, '-ubuntu-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-tags: true
      - if:
          ${{ !(startsWith(matrix.runner, 'blacksmith-') &&
          contains(matrix.runner, '-ubuntu-')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: ${{ matrix.save_toolchains }}
      - uses: ./.github/actions/setup-desktop-vulkan
      - id: desktop-tests
        run: mise run test:desktop:all
      - name: Upload desktop test results to Trunk
        if: ${{ !cancelled() && fromJSON(needs.plan.outputs.secrets) }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "build/desktop-backends/**/test-results/TEST-*.xml,**/build/test-results/test/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: ${{ matrix.test_variant }}
          previous-step-outcome: ${{ steps.desktop-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload desktop test reports
        if: ${{ failure() && steps.desktop-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: ${{ matrix.artifact_name }}-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
            build/desktop-backends
            **/hs_err_pid*.log
      - run: mise run build:desktop-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path:
            "demo-app/desktop-nucleus/build/packages/main/${{
            matrix.artifact_type }}/${{ matrix.artifact_glob }}"

  # The required check. A job skipped by its `if` passes, so a failed plan
  # must fail this one.
  all-good:
    if: ${{ always() }}
    needs:
      - plan
      - hygiene
      - abi
      - docs
      - js
      - ios-device
      - macos-native
      - android
      - ios
      - desktop
    timeout-minutes: 5
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          test "$PLAN" = success &&
          jq -e -n --argjson results "$RESULTS" 'all($results[]; .result == "success" or .result == "skipped")'
