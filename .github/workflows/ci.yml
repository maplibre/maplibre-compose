name: Windows Blacksmith probe

# Temporary investigation: restore the normal tier workflows before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  graphics:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: blacksmith-system-software-wsi
            runner: blacksmith-4vcpu-windows-2025
            agility: false
          - id: blacksmith-agility-software-wsi
            runner: blacksmith-4vcpu-windows-2025
            agility: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DZN_DEBUG: warp
      MESA_VK_WSI_DEBUG: sw
      MESA_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: ./.github/actions/setup-desktop-vulkan
      - name: Give dzn the Agility SDK
        if: matrix.agility
        shell: pwsh
        run: ./ci/install-probe-agility.ps1
      - name: Probe native graphics APIs without a window
        shell: pwsh
        run: ./ci/probe-windows-graphics.ps1
      - name: Run the full desktop suite for both backends
        run: mise run test:desktop:all
      - name: Upload probe test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offscreen-${{ matrix.id }}
          path: |
            build/desktop-backends
            **/build/test-results
            **/build/reports/tests
