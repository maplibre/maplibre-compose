name: ios job

# One CI job as a matrix over the variants ci/plan.py selected for it. The tier
# workflows call this; the variant is the only matrix dimension, so GitHub
# names each run after it.
on:
  workflow_call:
    inputs:
      matrix:
        description: The job's matrix, as ci/plan.py emits it.
        type: string
        required: true
      secrets-available:
        description: Whether repository secrets are available to this run.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  ios:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "false"
          native-cache-scope: ios-simulator
      # The oldest supported iOS, which the pbxproj deployment targets and
      # getting-started page name. The runner image ships only current runtimes.
      - if: ${{ matrix.ios-version != '' }}
        run: mise run ios-simulator:install-runtime ${{ matrix.ios-version }}
      - id: ios-tests
        run: mise run test:ios ${{ matrix.ios-version }}
      - name: Upload iOS test results to Trunk
        if: ${{ !cancelled() && inputs.secrets-available }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "**/build/test-results/iosSimulatorArm64Test/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: ios-simulator-${{ matrix.ios-version || 'arm64' }}
          previous-step-outcome: ${{ steps.ios-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload iOS test reports
        if: ${{ failure() && steps.ios-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: ios-${{ matrix.variant }}-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
      - if: ${{ matrix.variant == 'latest' }}
        run: mise run build:ios-simulator-app
      - if: ${{ matrix.variant == 'latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: demo-app-ios-simulator-arm64
          path: demo-app/ios/build/MapLibreCompose-ios-simulator-arm64.tar.gz
