name: ios-device job

# One CI job as a matrix over the variants ci/plan.py selected for it. The tier
# workflows call this; the variant is the only matrix dimension, so GitHub
# names each run after it.
on:
  workflow_call:
    inputs:
      matrix:
        description: The job's matrix, as ci/plan.py emits it.
        type: string
        required: true
      secrets-available:
        description: Whether repository secrets are available to this run.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  ios-device:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "false"
          native-cache-scope: ios-device
      - run: mise run build:ios:device
