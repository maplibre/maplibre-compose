name: Daily

on:
  schedule:
    - cron: 00 10 * * *
  workflow_dispatch:

jobs:
  check-last-run:
    runs-on: ubuntu-latest
    steps:
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        id: check-last-run
        with:
          route: |
            GET /repos/${{github.repository}}/actions/workflows/daily.yml/runs?per_page=1&status=completed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      last_sha: |
        ${{ fromJson(steps.check-last-run.outputs.data).workflow_runs[0].head_sha }}

  publish-snapshot:
    needs: [check-last-run]
    if: ${{ needs.check-last-run.outputs.last_sha != github.sha }}
    runs-on: macos-latest
    environment:
      name: maven-central-maplibre
      url: https://central.sonatype.com/repository/maven-snapshots/org/maplibre/compose/
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-gradle
      - run: |
          ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername:
            ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:
            ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
            ${{ secrets.GPG_PASSPHRASE }}
