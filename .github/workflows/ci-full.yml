name: CI full

# The full tier: variants a pull request gains from the ci:full label or from
# Dependabot authorship. Adding the label runs them; removing it records that
# the tier is no longer required, so an earlier failure stops blocking.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      secrets:
        type: boolean
        default: true

# State events may replace pending runs. Planning reuses only successful
# platform coverage, so the surviving run evaluates any missing coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  plan:
    permissions:
      checks: read
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-slim
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      restate: ${{ steps.plan.outputs.restate }}
      check: ${{ steps.plan.outputs.check }}
      secrets: ${{ steps.plan.outputs.secrets }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        # State events verify existing platform coverage through the Checks API.
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TIER: full
        run: bash .mise/tasks/ci/plan

  full:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    uses: ./.github/workflows/tier-full.yml
    with:
      secrets-available: ${{ fromJSON(needs.plan.outputs.secrets) }}
      desktop: ${{ needs.plan.outputs.desktop }}
    secrets: inherit
    permissions:
      actions: write
      contents: write

  all-good:
    name: all-good (full)
    if: ${{ always() }}
    needs:
      - plan
      - full
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          RESTATE: ${{ needs.plan.outputs.restate }}
          RESULT: ${{ needs.full.result }}
        run: bash .mise/tasks/ci/verdict
