name: CI full

# The full tier: variants a pull request gains from the ci:full label or from
# Dependabot authorship. Only this workflow reruns when the label is added.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

# Only a push makes an earlier run stale. A readiness or label event on the
# same commit may need the earlier run's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/ci-jobs.yml
    with:
      tier: full
    secrets: inherit
    permissions:
      actions: write
      checks: read
      contents: write
