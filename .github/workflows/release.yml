name: Release

on:
  push:
    tags: [v*.*.*]

permissions:
  contents: read

jobs:
  publish-maven:
    timeout-minutes: 60
    runs-on: macos-26
    environment:
      name: maven-central-maplibre
      url: https://central.sonatype.com/namespace/org.maplibre.compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .mise/bin/version-args reads the release tag off the checkout.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - run: mise run publish:release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername:
            ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:
            ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
            ${{ secrets.GPG_PASSPHRASE }}

  publish-pages:
    needs:
      - publish-maven
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      # A job-level block replaces the workflow-level one, so checkout needs this.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .mise/bin/version-args reads the release tag off the checkout.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          pnpm-cache: "true"
      - run: mise run build:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deploy-pages
