name: desktop job

# One CI job as a matrix over the variants ci/plan.py selected for it. The tier
# workflows call this; the variant is the only matrix dimension, so GitHub
# names each run after it.
on:
  workflow_call:
    inputs:
      matrix:
        description: The job's matrix, as ci/plan.py emits it.
        type: string
        required: true
      secrets-available:
        description: Whether repository secrets are available to this run.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    env:
      JAVA_TOOL_OPTIONS: ${{ matrix.java_tool_options }}
    steps:
      # Blacksmith's checkout caches the repository only on its Linux runners,
      # and on macOS it ignores `fetch-tags`.
      - if: ${{ startsWith(matrix.runner, 'blacksmith-') && contains(matrix.runner, '-ubuntu-') }}
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
          fetch-tags: true
      - if: ${{ !(startsWith(matrix.runner, 'blacksmith-') && contains(matrix.runner, '-ubuntu-')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: ${{ matrix.save_toolchains }}
      - name: Inspect the Windows graphics environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process -Id $PID | Select-Object ProcessName, SessionId
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, Status, VideoModeDescription
          Write-Output "SESSIONNAME=$env:SESSIONNAME"
          Write-Output "JAVA_TOOL_OPTIONS=$env:JAVA_TOOL_OPTIONS"
          @'
          import java.awt.*;
          class WindowsGraphicsProbe {
            public static void main(String[] args) throws Exception {
              System.out.println("java.awt.headless=" + System.getProperty("java.awt.headless"));
              System.out.println("GraphicsEnvironment.isHeadless=" + GraphicsEnvironment.isHeadless());
              try {
                System.out.println("screens=" + GraphicsEnvironment.getLocalGraphicsEnvironment().getScreenDevices().length);
                EventQueue.invokeAndWait(() -> {
                  Frame frame = new Frame("CI graphics probe");
                  try {
                    frame.setSize(128, 128);
                    frame.setVisible(true);
                    System.out.println("AWT window created: " + frame.isDisplayable());
                  } finally {
                    frame.dispose();
                  }
                });
              } catch (Throwable error) {
                error.printStackTrace();
              }
              System.exit(0);
            }
          }
          '@ | Set-Content "$env:RUNNER_TEMP/WindowsGraphicsProbe.java"
          java "$env:RUNNER_TEMP/WindowsGraphicsProbe.java"
      - uses: ./.github/actions/setup-desktop-vulkan
      - id: desktop-tests
        run: mise run test:desktop:all
      - name: Upload desktop test results to Trunk
        if: ${{ !cancelled() && inputs.secrets-available }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        with:
          junit-paths: "build/desktop-backends/**/test-results/TEST-*.xml,**/build/test-results/test/TEST-*.xml"
          org-slug: sargunv
          token: ${{ secrets.TRUNK_API_TOKEN }}
          variant: ${{ matrix.test_variant }}
          previous-step-outcome: ${{ steps.desktop-tests.outcome }}
          allow-missing-junit-files: "false"
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
      - name: Upload desktop test reports
        if: ${{ failure() && steps.desktop-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: ${{ matrix.artifact_name }}-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
            build/desktop-backends
      - if: ${{ !cancelled() }}
        run: mise run build:desktop-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: ${{ matrix.artifact_name }}
          path:
            "demo-app/desktop-nucleus/build/packages/main/${{ matrix.artifact_type }}/${{ matrix.artifact_glob }}"
