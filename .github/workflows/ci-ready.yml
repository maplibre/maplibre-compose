name: CI ready

# The ready tier: variants a pull request gains when it leaves draft status or
# opts in with the ci:full label. Only this workflow and CI full rerun on those
# events; removing the label records the downgraded tier's verdict.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      secrets:
        type: boolean
        default: true

# Only a push makes an earlier run stale. A readiness or label event on the
# same commit may need the earlier run's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-slim
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      restate: ${{ steps.plan.outputs.restate }}
      check: ${{ steps.plan.outputs.check }}
      secrets: ${{ steps.plan.outputs.secrets }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      desktop: ${{ steps.plan.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        # Planning needs only the runner Python standard library.
        env:
          CI_TIER: ready
        run: bash .mise/tasks/ci/plan

  ready:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    uses: ./.github/workflows/tier-ready.yml
    with:
      secrets-available: ${{ fromJSON(needs.plan.outputs.secrets) }}
      android: ${{ needs.plan.outputs.android }}
      ios: ${{ needs.plan.outputs.ios }}
      desktop: ${{ needs.plan.outputs.desktop }}
    secrets: inherit
    permissions:
      actions: write
      contents: write

  all-good:
    name: all-good (ready)
    if: ${{ always() }}
    needs:
      - plan
      - ready
    permissions:
      checks: read
    # Restating may wait for a sibling run on the same commit to finish.
    timeout-minutes: 60
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          RESTATE: ${{ needs.plan.outputs.restate }}
          RESULT: ${{ needs.ready.result }}
          CHECK_NAME: ${{ needs.plan.outputs.check }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .mise/tasks/ci/verdict
