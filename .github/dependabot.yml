# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Not supported by Dependabot:
# - mise tool versions: https://github.com/dependabot/dependabot-core/issues/12320
#   Bump the pins in `[vars]` in mise.toml by hand, then run `mise install`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, github_actions]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies, kotlin]
    ignore:
      # Follow the Kotlin compatibility matrix, not independent latest releases.
      - dependency-name: gradle-wrapper
      - dependency-name: com.android.application
      - dependency-name: com.android.kotlin.multiplatform.library
      - dependency-name: com.android.lint

      # Follow the Compose Multiplatform compatibility table, not independent latest releases.
      - dependency-name: androidx.compose.ui:ui-test-manifest
      - dependency-name: org.jetbrains.compose.material3:material3
      - dependency-name: org.jetbrains.androidx.navigation:navigation-compose
    groups:
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
      compose:
        patterns:
          - org.jetbrains.compose*
      kotlinx-coroutines:
        patterns:
          - org.jetbrains.kotlinx:kotlinx-coroutines-*
      ktor:
        patterns:
          - io.ktor:*
      maplibre:
        patterns:
          - org.maplibre.gl:*
          - org.maplibre.nativeffi:*
