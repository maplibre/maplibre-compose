# Placeholders. .mise/bin/version-args passes the real values, derived from Git
# tags, to the tasks that publish or document a version.
maplibreVersion=0.0.0-SNAPSHOT
maplibreReleaseVersion=0.0.0
maplibreSnapshotVersion=0.0.0-SNAPSHOT
maplibreSourceRef=main
#
# Project flags. Versions belong in gradle/libs.versions.toml.
demoAppMaplibreAndroidFlavor=default
#
# Dependency flags
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.incremental.wasm=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Linking an iOS release framework runs the whole Kotlin/Native optimizer over
# one binary, which is the heaviest thing this build does. It runs in the Gradle
# daemon, so this is the setting that governs it rather than
# kotlin.daemon.jvmargs, which was measured and made no difference. 2048M was
# measured as too little: linkReleaseFrameworkIosArm64 and its simulator sibling
# both died with an OutOfMemoryError.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
android.useAndroidX=true
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true
spmforkmp.disableStartupFile=true
POM_URL=https://github.com/maplibre/maplibre-compose/
POM_LICENSE_NAME=BSD-3-Clause
POM_LICENSE_URL=https://opensource.org/license/bsd-3-clause
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/maplibre/maplibre-compose
POM_SCM_CONNECTION=scm:git:git://github.com/maplibre/maplibre-compose.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/maplibre/maplibre-compose.git
POM_DEVELOPER_ID=maplibre
POM_DEVELOPER_NAME=MapLibre
POM_DEVELOPER_URL=https://github.com/maplibre/
