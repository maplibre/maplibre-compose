[versions]
# Platform floors and toolchain levels.
# compileSdk 37 is the API floor AGP 9.1.1 supports. targetSdk stays on 36,
# the latest shipping Android 16 behavior.
android-compileSdk = "37"
# The Build-Tools release AGP 9.1.1 consumes. Read by
# .mise/bin/sync-android-packages, not by Gradle.
android-buildTools = "36.0.0"
# Build the JNI shim in lib/maplibre-compose-runtime-vulkan-android. Read by
# .mise/bin/sync-android-packages too.
android-ndk = "28.2.13676358"
android-cmake = "4.1.2"
android-minSdk = "24"
android-targetSdk = "36"
# Compiler JDK for every JVM compilation. Must be >= java-desktopTarget.
java-toolchain = "25"
# Android bytecode target. Independent of the desktop target below.
java-androidTarget = "11"
# Desktop bytecode target. MapLibre Native FFI ships Java 24 bytecode and uses
# the FFM API, so desktop cannot go below 24.
java-desktopTarget = "25"

# Regular libraries: keep as up to date as possible.
accompanistPermissions = "0.37.3"
alchemist = "0.2.0"
androidx-activity = "1.13.0"
androidx-testRunner = "1.7.0"
bytesize = "2.2.1"
dbusJava = "5.2.0"
fflate = "0.8.3"
jsJodaTimezone = "2.22.0"
htmlConverterCompose = "1.1.1"
hms-location = "6.12.0.300"
nucleus = "2.5.4"
kermit = "2.1.0"
kotlin-dsv = "0.4.0"
kotlin-wrappers = "2026.8.4"
kotlinx-coroutines = "1.11.0"
kotlinx-atomicfu = "0.33.0"
kotlinx-io = "0.9.1"
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"
lifecycleRuntimeCompose = "2.11.0"
lwjgl = "3.4.2"
materialKolor = "5.0.0"
maplibre-js = "6.6.0"
maplibre-nativeFfi = "0.202608.3"
# The style-spec release the parity catalog reads; ci/style_spec_parity.py
# fetches v8.json at this tag. Follow the maplibre-gl release's own
# @maplibre/maplibre-gl-style-spec dependency when bumping maplibre-js.
maplibre-styleSpec = "26.3.0"
mobilityData = "0.4.0"
playServices-location = "21.4.0"
spatialk = "0.7.0"

# Regular tools: keep as up to date as possible
gradle-dokka = "2.2.0"
gradle-mavenPublish = "0.37.0"

# Libraries coupled to Compose: keep Compose up to date and set others accordingly.
# https://www.jetbrains.com/help/kotlin-multiplatform-dev/compose-compatibility-and-versioning.html#jetpack-compose-artifacts-used
gradle-compose = "1.12.0"
androidx-compose = "1.12.0"
jetbrains-compose-material3 = "1.12.0-alpha03"
# 1.3.x is still beta.
jetbrains-compose-material3-adaptive = "1.3.0-beta02"
jetbrains-navigation = "2.10.0-alpha02"

# Android and Kotlin: Keep Kotlin up to date and set Android accordingly.
# Also note the Gradle and XCode versions in the matrix!
# https://www.jetbrains.com/help/kotlin-multiplatform-dev/multiplatform-compatibility-guide.html
gradle-kotlin = "2.4.10"
# Kotlin 2.4.10 documents AGP through 9.1.0. 9.1.1 is the floor for
# compileSdk 37.
gradle-android = "9.1.1"

[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
alchemist = { module = "io.github.kevincianfarini.alchemist:alchemist", version.ref = "alchemist" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-composeUi-testManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-testRunner" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrains-navigation" }
bytesize = { module = "me.saket.bytesize:bytesize", version.ref = "bytesize" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbusJava" }
dbus-java-transport-native-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbusJava" }
htmlConverterCompose = { module = "be.digitalia.compose.htmlconverter:htmlconverter", version.ref = "htmlConverterCompose" }
hms-location = { module = "com.huawei.hms:location", version.ref = "hms-location" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
