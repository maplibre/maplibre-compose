[versions]
# Platform floors and toolchain levels.
# compileSdk 37 is the API floor AGP 9.1.1 supports. targetSdk stays on 36,
# the latest shipping Android 16 behavior.
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
# Compiler JDK for every JVM compilation. Must be >= java-desktopTarget.
java-toolchain = "25"
# Android bytecode target. Independent of the desktop target below.
java-androidTarget = "11"
# Desktop bytecode target. MapLibre Native FFI ships Java 24 bytecode and uses
# the FFM API, so desktop cannot go below 24.
java-desktopTarget = "25"

# Regular libraries: keep as up to date as possible.
accompanistPermissions = "0.37.3"
alchemist = "0.2.0"
androidx-activity = "1.13.0"
androidx-testRunner = "1.7.0"
bytesize = "2.2.1"
composeGlfw = "0.2.0"
dbusJava = "5.2.0"
htmlConverterCompose = "1.1.1"
kermit = "2.1.0"
kotlin-dsv = "0.4.0"
kotlin-wrappers = "2026.8.2"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.1"
ktor = "3.5.2"
lifecycleRuntimeCompose = "2.10.0"
lwjgl = "3.4.2"
maplibre-js = "6.2.0"
maplibre-nativeFfi = "0.202608.3"
mobilityData = "0.4.0"
playServices-location = "21.4.0"
spatialk = "0.7.0"

# Regular tools: keep as up to date as possible
gradle-dokka = "2.2.0"
gradle-mavenPublish = "0.37.0"

# Libraries coupled to Compose: keep Compose up to date and set others accordingly.
# https://www.jetbrains.com/help/kotlin-multiplatform-dev/compose-compatibility-and-versioning.html#jetpack-compose-artifacts-used
gradle-compose = "1.11.1"
androidx-compose = "1.11.2"
jetbrains-compose-material3 = "1.11.0-alpha07"
# 1.3.x is still beta.
jetbrains-compose-material3-adaptive = "1.2.0"
jetbrains-navigation = "2.9.2"

# Android and Kotlin: Keep Kotlin up to date and set Android accordingly.
# Also note the Gradle and XCode versions in the matrix!
# https://www.jetbrains.com/help/kotlin-multiplatform-dev/multiplatform-compatibility-guide.html
gradle-kotlin = "2.4.10"
# Kotlin 2.4.10 documents AGP through 9.1.0. 9.1.1 is the floor for
# compileSdk 37.
gradle-android = "9.1.1"

[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
alchemist = { module = "io.github.kevincianfarini.alchemist:alchemist", version.ref = "alchemist" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-composeUi-testManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-testRunner" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrains-navigation" }
bytesize = { module = "me.saket.bytesize:bytesize", version.ref = "bytesize" }
composeGlfw = { module = "dev.sargunv:compose-glfw", version.ref = "composeGlfw" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbusJava" }
dbus-java-transport-native-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbusJava" }
htmlConverterCompose = { module = "be.digitalia.compose.htmlconverter:htmlconverter", version.ref = "htmlConverterCompose" }
kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }
kotlin-dsv = { module = "dev.sargunv.kotlin-dsv:kotlin-dsv", version.ref = "kotlin-dsv" }
kotlin-wrappers-browser = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-browser", version.ref = "kotlin-wrappers" }
kotlin-wrappers-js = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-js", version.ref = "kotlin-wrappers" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-playServices = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycleRuntimeCompose" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
jetbrains-compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "gradle-compose" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "gradle-compose" }
jetbrains-compose-html-core = { module = "org.jetbrains.compose.html:html-core", version.ref = "gradle-compose" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "jetbrains-compose-material3" }
jetbrains-compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "jetbrains-compose-material3-adaptive" }
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "gradle-compose" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "gradle-compose" }
jetbrains-compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "gradle-compose" }
