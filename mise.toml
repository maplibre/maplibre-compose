# https://mise.jdx.dev

monorepo_root = true
min_version = "2026.7.15"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]
pin = true
experimental = true
# Keeps mise paths ahead of the Microsoft Store Python alias on Windows.
activate_aggressive = true
# Installing an SDK package accepts its license, so it is never a side effect.
auto_install_disable_tools = ["android-sdk"]

[monorepo]
config_roots = ["docs"]
lockfile = true

# Cascades to every config root. Scoped to tasks; hooks and tool installs still
# use the platform shell.
[task_config]
cascade = true
shell = "bash -e -c"

[vars]
android_cmdline_tools_version = "22.0"
android_api_level = "36"
actionlint_version = "1.7.12"
dprint_version = "0.55.2"
hk_version = "1.54.1"
java_version = "zulu-25.36.15.0"
jvl_version = "2026.05.03"
ktfmt_version = "0.64"
node_version = "24.19.0"
playwright_version = "1.62.1"
pnpm_version = "10.33.2"
python_version = "3.14.7"
ruff_version = "0.16.2"
shellcheck_version = "0.11.0"
swiftformat_version = "0.62.1"
xcodes_version = "2.0.3"

[tools]
"aqua:jdx/hk" = "{{vars.hk_version}}" # Linter orchestration
"aqua:dprint/dprint" = "{{vars.dprint_version}}" # Formatter orchestration
"github:sargunv/jvl" = "{{vars.jvl_version}}" # JSON schema validator
"aqua:rhysd/actionlint" = "{{vars.actionlint_version}}" # GH Actions linter
"aqua:koalaman/shellcheck" = "{{vars.shellcheck_version}}" # Shell linter, also used by actionlint
"aqua:astral-sh/ruff" = "{{vars.ruff_version}}" # Python linter for ci/ and .mise/tasks/

"core:java" = "{{vars.java_version}}"
"aqua:facebook/ktfmt" = "{{vars.ktfmt_version}}"

# For tooling outside Gradle; Kotlin/JS brings its own Node and Yarn.
"core:node" = "{{vars.node_version}}"
"aqua:pnpm/pnpm" = "{{vars.pnpm_version}}"
"npm:playwright" = "{{vars.playwright_version}}"

# Runs the Python file tasks under .mise/tasks/.
"core:python" = "{{vars.python_version}}"

# Upstream ships Windows as an MSI only, which this backend cannot unpack, and
# nothing formats Swift on Windows anyway.
swiftformat = { version = "{{vars.swiftformat_version}}", backend = "github:nicklockwood/SwiftFormat", no_app = true, rename_exe = "swiftformat", os = ["macos", "linux"] }

# The CLI only. Xcode itself comes from `mise run install-xcode`.
"aqua:XcodesOrg/xcodes" = { version = "{{vars.xcodes_version}}", os = ["macos"] }

[env]
PLAYWRIGHT_BROWSERS_PATH = "{{ config_root }}/.cache/playwright"
CHROME_BIN = { value = '''{{ exec(command="node -e \"console.log(require(process.argv[1]).chromium.executablePath())\" \"" ~ tools.playwright.path ~ "/node_modules/playwright\"") }}''', tools = true }

[hooks]
postinstall = ["hk install --mise --quiet"]

[deps.pnpm]
auto = true

[deps.chromium]
auto = true
sources = ["mise.lock"]
outputs = [".cache/playwright/chromium-*"]
run = "playwright install chromium --no-shell"

[tasks.check]
description = "Run every formatter and linter in report-only mode."
# The type checker reads the types Astro generates.
run = '''
mise run //docs:install
hk check --all
'''

[tasks.fix]
description = "Apply every formatter and auto-fixable lint."
run = '''
mise run //docs:install
hk fix --all
'''

[tasks.clean]
description = "Remove every Gradle build output."
run = "./gradlew clean"

[tasks."android-sdk-packages"]
description = "Install the pinned Android SDK packages into $ANDROID_HOME."
run = 'bash .mise/bin/sync-android-packages "{{vars.java_version}}"'

[tasks."lint:android"]
description = "Run Android Lint across the modules that declare an Android target."
run = "./gradlew lint"

[tasks."test:android"]
description = "Run the Android host (JVM) test suite."
# One task name per Android plugin: the demo app is a com.android.application,
# the library modules use the KMP Android plugin. Either alone covers half.
run = "./gradlew testDebugUnitTest testAndroidHostTest"

[tasks."test:android:publishing"]
description = "Publish the runtime-only Android artifacts to an isolated local Maven repository."
depends = ["android-sdk-packages"]
run = '''
repository="$PWD/build/test-maven-repository"
rm -rf -- "$repository"
./gradlew \
  -Dmaven.repo.local="$repository" \
  :lib:maplibre-compose-runtime-opengl-android:publishToMavenLocal
./gradlew \
  -Dmaven.repo.local="$repository" \
  :lib:maplibre-compose-runtime-vulkan-android:publishToMavenLocal
'''
[tasks."android-emulator:boot"]
description = "Boot an Android emulator and wait until it is ready."
usage = '''
flag "--headless" help="Run the emulator without a window."
arg "[api_level]" default="{{vars.android_api_level}}"
'''
tools = { "core:java" = "{{vars.java_version}}" }
run = '''
args=("$usage_api_level")
if [[ "$usage_headless" == "true" ]]; then
  args+=(--headless)
fi
.mise/bin/boot-android-emulator "${args[@]}"
'''

[tasks."android-emulator:stop"]
description = "Stop the Android emulator started by mise."
run = ".mise/bin/stop-android-emulator"

[tasks."android-emulator:diagnostics"]
description = "Capture bounded diagnostics from the Android emulator."
run = ".mise/bin/capture-android-emulator-diagnostics"

[tasks."test:android:device"]
description = "Run the Android instrumented test suite on an emulator."
usage = 'arg "[api_level]" default="{{vars.android_api_level}}"'
depends = [
  { task = "android-emulator:boot", args = ["{{usage.api_level}}", "--headless"] },
]
# One task name per Android plugin; see test:android.
run = '.mise/bin/run-android-device-tests "$usage_api_level"'

[tasks."ios-simulator:boot"]
description = "Boot an iPhone simulator and print its UDID."
run = ".mise/bin/boot-ios-simulator"

[tasks."build:ios:device"]
description = "Link the demo framework for the iOS device target."
run = "./gradlew :demo-app:common:linkDebugFrameworkIosArm64"

[tasks."test:ios"]
description = "Run the iOS simulator test suite."
run = '''
udid="$(.mise/bin/boot-ios-simulator)"
./gradlew iosSimulatorArm64Test -- --device "$udid"
'''

[tasks."test:js"]
description = "Run the Kotlin/JS browser test suite."
run = "./gradlew jsBrowserTest"

[tasks."test:desktop"]
description = "Run the desktop (JVM) test suite against a real Vulkan or Metal device."
usage = '''
flag "--backend <name>" help="Map render backend to test, e.g. opengl or vulkan. Defaults to the platform's preferred backend."
'''
run = '''
if [ -n "$usage_backend" ]; then
  ./gradlew jvmTest -Pmaplibre.desktop.backend="$usage_backend"
else
  ./gradlew jvmTest
fi
'''

[tasks."build:docs"]
description = "Build the documentation site and the Dokka API reference into docs/dist."
run = "mise run //docs:build"

[tasks."build:js-app"]
description = "Build the browser demo app for static hosting."
# The docs api task also runs Gradle; two Gradle builds in one checkout can
# fail, so run one at a time when a docs task schedules both.
wait_for = ["//docs:api"]
run = "./gradlew :demo-app:common:jsBrowserDistribution"

[tasks."build:pages"]
description = "Build the complete GitHub Pages site into docs/dist."
run = '''
mise run build:docs
mise run build:js-app
mkdir -p docs/dist/demo/app
cp -a demo-app/common/build/dist/js/productionExecutable/. docs/dist/demo/app/
mise run package:cloudflare-pages
'''

[tasks."package:cloudflare-pages"]
description = "Package the complete site for Cloudflare Pages."
run = '''
test -d docs/dist
rm -rf build/cloudflare-pages
mkdir -p build/cloudflare-pages/maplibre-compose
cp -a docs/dist/. build/cloudflare-pages/maplibre-compose/
cp docs/cloudflare-pages/_redirects build/cloudflare-pages/_redirects
'''

[tasks."test:pages"]
description = "Load the embedded browser demo from the packaged Cloudflare Pages site."
depends = ["build:pages"]
run = '''
pages_test_dir="$(mktemp -d)"
pages_preview_pid=""

cleanup() {
  if [ -n "$pages_preview_pid" ]; then
    kill "$pages_preview_pid" 2>/dev/null || true
    wait "$pages_preview_pid" 2>/dev/null || true
  fi
  rm -rf -- "$pages_test_dir"
}
trap cleanup EXIT

grep --fixed-strings --line-regexp --quiet \
  "/ /maplibre-compose/ 302" \
  build/cloudflare-pages/_redirects

python -m http.server 4321 \
  --bind 127.0.0.1 \
  --directory build/cloudflare-pages \
  >"$pages_test_dir/preview.log" 2>&1 &
pages_preview_pid=$!

for _ in {1..30}; do
  if curl --fail --silent --output /dev/null http://127.0.0.1:4321/maplibre-compose/demo/app/; then
    break
  fi
  if ! kill -0 "$pages_preview_pid" 2>/dev/null; then
    cat "$pages_test_dir/preview.log"
    exit 1
  fi
  sleep 1
done

curl --fail --silent --output /dev/null http://127.0.0.1:4321/maplibre-compose/demo/
curl --fail --silent --output /dev/null http://127.0.0.1:4321/maplibre-compose/demo/app/
demo_page="$(curl --fail --silent http://127.0.0.1:4321/maplibre-compose/demo/)"
printf '%s\n' "$demo_page" | grep --fixed-strings --quiet 'src="/maplibre-compose/demo/app/"'
playwright screenshot \
  --channel chromium \
  --save-har "$pages_test_dir/demo.har" \
  --save-har-glob '**/composeResources/**' \
  --timeout 30000 \
  --wait-for-selector 'canvas[role="generic"]' \
  http://127.0.0.1:4321/maplibre-compose/demo/app/ \
  "$pages_test_dir/demo.png"

node - "$pages_test_dir/demo.har" <<'NODE'
const fs = require("node:fs");

const entries = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).log.entries;
if (entries.length === 0) {
  throw new Error("The demo requested no Compose resources.");
}

const expectedPrefix =
  "http://127.0.0.1:4321/maplibre-compose/demo/app/composeResources/";
const misplaced = entries.filter((entry) => !entry.request.url.startsWith(expectedPrefix));
if (misplaced.length > 0) {
  throw new Error(
    `Compose resources used URLs outside the demo: ${misplaced.map((entry) => entry.request.url).join(", ")}`,
  );
}

const failed = entries.filter(
  (entry) => entry.response.status < 200 || entry.response.status >= 400,
);
if (failed.length > 0) {
  throw new Error(
    `Compose resources failed to load: ${failed.map((entry) => `${entry.response.status} ${entry.request.url}`).join(", ")}`,
  );
}
NODE
'''

[tasks."build:android-app"]
description = "Package the demo app as a debug APK."
run = "./gradlew :demo-app:android:packageDebug"

[tasks."build:desktop-app"]
description = "Package the demo app as a native installer for this host."
run = "./gradlew :demo-app:desktop:packageDistributionForCurrentOS"

[tasks."demo:android"]
description = "Run the demo app on a connected Android device or emulator."
usage = '''
arg "[serial]" help="adb serial. Prompts when several devices are connected."
flag "--backend <backend>" help="Render backend to package: opengl (default) or vulkan."
'''
# The device prompt needs the real terminal; mise otherwise pipes stdio.
raw = true
run = ".mise/bin/run-android-demo"

[tasks."demo:desktop"]
description = "Run the demo app on this host."
usage = '''
flag "--backend <name>" help="Map render backend to run, e.g. opengl or vulkan. Defaults to the platform's preferred backend."
'''
run = '''
args=""
if [ -n "$usage_backend" ]; then
  args="-Pmaplibre.desktop.backend=$usage_backend"
fi
if [ "$(uname -s)" = Darwin ]; then
  # Core Location reads the usage description from a packaged app Info.plist.
  ./gradlew :demo-app:desktop:runDistributable $args
else
  ./gradlew :demo-app:desktop:run $args
fi
'''

[tasks."demo:js"]
description = "Run the demo app in a browser."
run = "./gradlew :demo-app:common:jsBrowserDevelopmentRun"

[tasks."demo:ios"]
description = "Run the demo app on an iOS simulator or a connected iPhone."
usage = '''
flag "--device" help="Run on a connected iPhone instead of a simulator."
flag "--release" help="Build the Release configuration, with the optimized Kotlin/Native binary."
arg "[udid]" help="Device or simulator UDID. Prompts when several are ready."
'''
# The device prompt needs the real terminal; mise otherwise pipes stdio.
raw = true
run = '.mise/bin/run-ios-demo'

[tasks."demo:desktop-glfw"]
description = "Run the demo app on the compose-glfw desktop host instead of the AWT one."
usage = '''
flag "--backend <name>" help="Map render backend to run, e.g. opengl or vulkan. Defaults to the platform's preferred backend."
'''
run = '''
args=""
if [ -n "$usage_backend" ]; then
  args="-Pmaplibre.desktop.backend=$usage_backend"
fi
if [ "$(uname -s)" = Darwin ]; then
  # Core Location reads the usage description from a packaged app Info.plist.
  ./gradlew :demo-app:desktop-glfw:runDistributable $args
else
  ./gradlew :demo-app:desktop-glfw:run $args
fi
'''

[tasks."demo:desktop-nucleus"]
description = "Run the demo app on the Nucleus Tao desktop host instead of the AWT one."
usage = '''
flag "--backend <name>" help="Map render backend to run, e.g. opengl or vulkan. Defaults to the platform's preferred backend."
'''
run = '''
args=""
if [ -n "$usage_backend" ]; then
  args="-Pmaplibre.desktop.backend=$usage_backend"
fi
./gradlew :demo-app:desktop-nucleus:run $args
'''

[tasks."publish:snapshot"]
description = "Publish a snapshot build to Maven Central."
# Publishing builds the Vulkan runtime AAR, which needs the pinned NDK and CMake.
depends = ["android-sdk-packages"]
run = ".mise/bin/gradle-with-version snapshot publishToMavenCentral"

[tasks."publish:release"]
description = "Publish and release the current tag to Maven Central."
depends = ["android-sdk-packages"]
run = ".mise/bin/gradle-with-version release publishAndReleaseToMavenCentral --no-configuration-cache"

[tasks.version]
description = "Print the version properties this checkout builds with."
usage = '''
arg "[mode]" default="build" {
  choices "build" "snapshot" "release"
}
'''
run = '.mise/bin/version-args "$usage_mode"'

[tasks.actions-up]
description = "Update and pin GitHub Actions steps."
run = "npx -y actions-up"
