[tasks.api]
description = "Generate the Dokka API reference into the site's public directory."
dir = ".."
run = '''
.mise/bin/gradle-with-version build dokkaGenerate
rm -rf docs/public/api
mkdir -p docs/public/api
cp -a build/dokka/html/. docs/public/api/
node docs/scripts/generate-api-index.mjs
'''

[tasks.versions]
description = "Write the versions the pages quote into src/generated."
dir = ".."
run = '''
flags="$(.mise/bin/version-args build)"
printf '%s\n' "$flags" | node docs/scripts/generate-versions.mjs
'''

[tasks.install]
# Hygiene runs this for Astro's generated types and does not fetch Git tags, so
# `versions` cannot run there. A stub is enough for `astro sync`; `build` and
# `dev` overwrite it with the real file.
run = '''
if [ ! -f src/generated/versions.json ]; then
  mkdir -p src/generated
  printf '%s\n' '{"release":"0.0.0","snapshot":"0.0.0-SNAPSHOT","maplibreJs":"0.0.0"}' > src/generated/versions.json
fi
pnpm exec astro sync
'''

[tasks.demo]
description = "Copy the browser demo into the site's public directory."
dir = ".."
depends = ["//:build:js-app"]
run = '''
rm -rf docs/public/demo
mkdir -p docs/public/demo/app
cp -a demo-app/common/build/dist/js/productionExecutable/. docs/public/demo/app/
'''

[tasks.dev]
description = "Serve the documentation site with live reload."
depends = ["api", "versions", "install", "demo"]
run = "pnpm run dev"

[tasks.build]
description = "Build the documentation site into docs/dist."
depends = ["api", "versions", "install"]
run = "pnpm run build"

[tasks.preview]
description = "Serve the built documentation site."
# `astro preview` serves docs/dist rather than producing it.
depends = ["//docs:build"]
run = "pnpm run preview"

[tasks.astro]
run = "pnpm exec astro"
